allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
disallowed-methods = [
  # Its UCred holds the PID as never 0, which the kernel gives for a peer in
  # a PID namespace the caller cannot see: reading one is undefined
  # behaviour. The broker reads SO_PEERCRED with nix's PeerCredentials.
  { path = "rustix::net::sockopt::socket_peercred", reason = "a peer's PID of 0 is undefined behaviour in rustix's UCred; use nix's PeerCredentials" },
]
# Product and protocol names that are not code items.
doc-valid-idents = ["WebUI", "OpenID", "SELinux", "SQLite", "UserInfo", "OpenAPI", "TypeScript", "JavaScript", "CycloneDX", ".."]
