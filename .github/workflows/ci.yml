name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Stalwart replaces its WebUI and its images without a push here: the
  # contract tests run every Monday as well.
  schedule:
    - cron: "23 4 * * 1"

# Actions are pinned to commits; Renovate (renovate.json) keeps them current.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; the token does not stay in .git/config.
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Documentation without warnings
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace --locked
      - name: Layering and file sizes
        run: cargo xtask check
      - name: Licenses, advisories and sources
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny --locked check
      - name: Unused dependencies
        run: |
          cargo install --locked cargo-machete --version 0.9.2
          cargo machete

  coverage:
    # The tests once more, counting the lines they run (.cargo/config.toml).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain with llvm-tools, and cargo-llvm-cov 0.9.1
        run: |
          rustup toolchain install
          rustup component add llvm-tools
          cargo install --locked cargo-llvm-cov --version 0.9.1
      - name: Tests run at least 90 % of the product's lines
        run: cargo coverage --summary-only

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities in dependencies
        run: npm run audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unused files, exports and dependencies
        run: npm run knip
      - name: Tests and coverage thresholds
        run: npm run coverage
      - name: Generated API types are current
        run: |
          npm run api
          git diff --exit-code src/api/schema.gen.ts
      - run: npm run build

  browser:
    # What a user does, in a real Chrome against the preview: sign-in, every
    # page, the menu, a search, the settings, an action and sign-out. No error
    # in the console, no failed request, nothing for axe (e2e/flows.mjs).
    runs-on: ubuntu-24.04
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build the preview
        run: cargo build --locked -p garrison-web --example preview
      # The runner's own Chrome is used, so no browser is downloaded.
      - name: Run the flows against the preview
        timeout-minutes: 5
        run: |
          target/debug/examples/preview &
          cd e2e
          npm ci --ignore-scripts
          until curl -sf -o /dev/null http://localhost:18091/admin/; do
            sleep 1
          done
          npm run flows

  scripts:
    # The workflows themselves and the shell scripts of the acceptance tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12 and ShellCheck 0.11.0
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          sha256sum -c - <<'SUMS'
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck-v0.11.0.linux.x86_64.tar.xz
          SUMS
          mkdir bin
          tar -xf actionlint_1.7.12_linux_amd64.tar.gz -C bin actionlint
          tar -xf shellcheck-v0.11.0.linux.x86_64.tar.xz --strip-components=1 -C bin shellcheck-v0.11.0/shellcheck
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Workflows, with the shell in their steps
        run: actionlint
      - name: Shell scripts
        run: shellcheck scripts/*.sh

  contract:
    # Runs Garrison's assumptions against each supported Stalwart release
    # (the images of `cargo xtask lab`; a test keeps this list equal to them).
    runs-on: ubuntu-24.04
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        stalwart: ["1.1.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Start Stalwart ${{ matrix.stalwart }} and run contract tests
        env:
          STALWART: ${{ matrix.stalwart }}
        run: |
          eval "$(cargo xtask lab start "$STALWART")"
          cargo test --workspace --locked --test contract -- --ignored
      - if: always()
        run: cargo xtask lab stop
