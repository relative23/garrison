name: Bug report
description: Something in Garrison does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Please remove addresses, host names, tokens and
        passwords from everything you paste; made-up values show the problem just as well.
  - type: input
    id: version
    attributes:
      label: Garrison version
      description: The output of `garrison --version`, or the commit.
      placeholder: garrison 0.1.1
    validations:
      required: true
  - type: input
    id: stalwart
    attributes:
      label: Stalwart version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Operating system and architecture
      placeholder: AlmaLinux 10, aarch64
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Mail flow ▸ Deliveries
        2. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        For example `journalctl -u 'garrison-*' --since -1h` and the output of
        `sudo garrison self-check`, with personal data removed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, tokens and personal data from this report.
          required: true
