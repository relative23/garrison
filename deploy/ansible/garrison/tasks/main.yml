---
# Install, configure and upgrade Garrison; the play needs `become: true`.
# Every task can run again: a second run changes only what changed, and a run
# that stopped anywhere is finished by the next. What the installer last
# finished with is kept in /opt/garrison, which goes with an uninstallation;
# the record is taken away before the installer runs again.

- name: The release and the addresses are named
  ansible.builtin.assert:
    that:
      - garrison_version | length > 0
      - garrison_public_origin is match('^https://')
      - garrison_issuer is match('^https://')
      - garrison_unsigned or garrison_signing_key | length > 0
    fail_msg: >-
      Set garrison_version, garrison_public_origin, garrison_issuer and
      garrison_signing_key (or garrison_unsigned for a release before the first
      signed one).

- name: The archive's name
  ansible.builtin.set_fact:
    garrison_name: "garrison-{{ garrison_version }}-{{ garrison_arch }}"

- name: The archive carries a signature by the release key
  ansible.builtin.command:
    argv:
      - minisign
      - -Vm
      - "{{ garrison_archives }}/{{ garrison_name }}.tar.gz"
      - -P
      - "{{ garrison_signing_key }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: garrison_signature
  when: not garrison_unsigned

- name: The signature names exactly this release
  ansible.builtin.assert:
    # A block scalar: the colon in the pattern would make a plain one a mapping.
    that:
      - >-
        garrison_signature.stdout is search('^Trusted comment: garrison '
        ~ (garrison_version | regex_escape) ~ ' ' ~ (garrison_arch | regex_escape)
        ~ '$', multiline=True)
    fail_msg: The signature is valid but belongs to another release.
  when: not garrison_unsigned

- name: The archive is on the host
  ansible.builtin.copy:
    src: "{{ garrison_archives }}/{{ garrison_name }}.tar.gz"
    dest: "/root/{{ garrison_name }}.tar.gz"
    owner: root
    group: root
    mode: "0600"

# Whole and from this archive: the archive's SHA256SUMS, and every file it
# lists as it lists it. Anything else, such as a copy cut short or one of an
# earlier archive, is unpacked afresh.
- name: Whether the release is unpacked whole
  ansible.builtin.shell: >-
    cd /root/{{ garrison_name | quote }} &&
    sums=$(tar -xzOf ../{{ garrison_name | quote }}.tar.gz {{ garrison_name | quote }}/SHA256SUMS) &&
    test "$sums" = "$(cat SHA256SUMS)" &&
    printf '%s\n' "$sums" | sha256sum --check --quiet --strict
  register: garrison_unpacked
  changed_when: false
  failed_when: false

- name: An earlier unpacked copy is removed
  ansible.builtin.file:
    path: "/root/{{ garrison_name }}"
    state: absent
  when: garrison_unpacked.rc != 0

- name: The release is unpacked
  ansible.builtin.unarchive:
    src: "/root/{{ garrison_name }}.tar.gz"
    dest: /root
    remote_src: true
  when: garrison_unpacked.rc != 0

- name: The running release
  ansible.builtin.slurp:
    src: /opt/garrison/current/VERSION
  register: garrison_running
  failed_when: false

- name: Its version
  ansible.builtin.set_fact:
    garrison_installed: "{{ (garrison_running.content | default('')) | b64decode | trim }}"

- name: The release is installed (the first time, it starts nothing)
  ansible.builtin.command:
    cmd: "/root/{{ garrison_name }}/bin/garrison install"
  when: garrison_installed | length == 0

- name: The configuration
  ansible.builtin.template:
    src: garrison.toml.j2
    dest: /etc/garrison/garrison.toml
    owner: root
    group: root
    mode: "0644"
  register: garrison_config

# An empty key file, or one of a line end alone, gives its service no key,
# as a missing one does: setup runs where any of the three holds none.
- name: What the key files setup writes hold
  ansible.builtin.command:
    argv: [grep, -qs, "[^[:space:]]", "/etc/garrison/credentials/{{ item }}"]
  loop: [webhook-signature-key, collector-native-key, broker-native-key]
  register: garrison_keys
  changed_when: false
  failed_when: false
  when: garrison_stalwart_admin | length > 0

# The release being installed, not the one in /opt/garrison/current: on an
# upgrade that is still the release being replaced, whose setup may not
# make a key where a file holds none (0.1.0 to 0.1.2 keep an empty file and
# stop), and then the play would never install the one that does.
- name: Stalwart is connected (the administrator goes in on standard input)
  ansible.builtin.command:
    argv:
      - "/root/{{ garrison_name }}/bin/garrison"
      - stalwart
      - setup
      - --admin-credential
      - "-"
    stdin: "{{ garrison_stalwart_admin | to_json }}"
  register: garrison_setup
  # Hides the administrator on standard input; what setup says holds no
  # secret and is shown next.
  no_log: true
  failed_when: false
  when: >-
    garrison_stalwart_admin | length > 0
    and garrison_keys.results | rejectattr('rc', 'equalto', 0) | list | length > 0

- name: What setup said
  ansible.builtin.debug:
    msg: "{{ garrison_setup.stdout_lines + garrison_setup.stderr_lines }}"
  failed_when: garrison_setup.rc != 0
  when: garrison_setup is not skipped

- name: Stalwart's administrators have access
  ansible.builtin.command:
    cmd: /opt/garrison/current/bin/garrison access init
    creates: /etc/garrison/access-policy.json

- name: What the installer last finished with
  ansible.builtin.slurp:
    src: /opt/garrison/ansible-installed
  register: garrison_finished
  failed_when: false

- name: Whether the installer is due
  ansible.builtin.set_fact:
    garrison_install_due: >-
      {{ garrison_installed != garrison_version
      or (garrison_finished.content | default('') | b64decode | trim)
      != garrison_version ~ ' ' ~ garrison_config.checksum }}

- name: The record of a finished installation goes first
  ansible.builtin.file:
    path: /opt/garrison/ansible-installed
    state: absent
  when: garrison_install_due | bool

- name: Garrison runs this release with this configuration
  ansible.builtin.command:
    cmd: "/root/{{ garrison_name }}/bin/garrison install"
  when: garrison_install_due | bool

- name: The installer finished with this release and this configuration
  ansible.builtin.copy:
    content: "{{ garrison_version }} {{ garrison_config.checksum }}\n"
    dest: /opt/garrison/ansible-installed
    owner: root
    group: root
    mode: "0644"
  when: garrison_install_due | bool

- name: garrison doctor
  ansible.builtin.command:
    cmd: /opt/garrison/current/bin/garrison doctor
  register: garrison_doctor
  changed_when: false
  failed_when: garrison_doctor.rc == 2

- name: What doctor found
  ansible.builtin.debug:
    var: garrison_doctor.stdout_lines
