# Include inside the HTTPS server block of Garrison's own host name
# (deployment.public_origin), e.g.:  include /etc/nginx/snippets/garrison.conf;
#
# That host serves nothing else: Garrison answers on all of it, with its
# interface under /admin/ like the Stalwart WebUI. The Stalwart WebUI keeps its
# own host name and server block, whose pages Garrison does not modify (the
# optional switch row is a separate include). This file never goes into
# Stalwart's server block, which has a `location /` of its own.

location / {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The only client address Garrison trusts; it is set here, never passed on.
    proxy_set_header X-Garrison-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
