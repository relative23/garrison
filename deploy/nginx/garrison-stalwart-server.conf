# Include at the server level of every server block that proxies to Stalwart
# (its mail host and the Stalwart WebUI's host), e.g.:
#     include /etc/nginx/snippets/garrison-stalwart-server*.conf;
# The `*` keeps nginx valid when Garrison is not installed.
#
# `garrison stalwart setup` turns on Stalwart's Prometheus exporter at
# /metrics/ for Garrison, which reads it over loopback. The exporter wants a
# password, but it has no business on the internet at all.

location = /metrics {
    return 404;
}
location ^~ /metrics/ {
    return 404;
}
