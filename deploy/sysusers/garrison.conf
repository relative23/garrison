# systemd-sysusers: one system user per service, a shared read group for the
# web service. Installed to /etc/sysusers.d/garrison.conf.
g garrison           -
u garrison           - "Garrison web service"     /var/empty /usr/sbin/nologin
u garrison-ingest    - "Garrison event receiver"  /var/empty /usr/sbin/nologin
u garrison-collector - "Garrison status collector" /var/empty /usr/sbin/nologin
u garrison-broker    - "Garrison action broker"   /var/empty /usr/sbin/nologin
# Runs only where the macro milter is switched on; it owns no file.
u garrison-milter    - "Garrison macro milter"    /var/empty /usr/sbin/nologin
# The ingest service and collector write files the web service reads; the
# collector also reads the event history for the running Stalwart version.
m garrison-ingest    garrison
m garrison-collector garrison
